# ==============================================================================
# WINDOW & DISPLAY CONTROLS (Forced Full Screen - Single Display)
# ==============================================================================
fullscreen=yes
ontop=yes
window-maximized=yes

# ==============================================================================
# Global Video & Application Setup
# ==============================================================================
vo=gpu-next
gpu-api=d3d11
gpu-context=d3d11
d3d11-exclusive-fs=no
d3d11-output-format=rgb10_a2
hwdec=d3d11va

# ===============================================================================
# Uncomment temporarily only when capturing a debug log
# ===============================================================================

# --- Debug Logging for AI Code Review (Uncomment top line to enable and one of the msglevel lines) ---
# log-file="~~/mpv-debug.log"

# --- Debug Logging for AI Code Review (verbose for shader analysis/Gemini) ---
# msg-level=all=warn,cplayer=v,vo/gpu-next=v,vo/gpu-next/libplacebo=v,script=v,auto_profiles=v

# --- Debug Logging for AI Code Review ( less verbose/Better for Pay as You Go API AI) ---
# msg-level=all=warn,cplayer=v,vo/gpu-next=v,script=v,auto_profiles=v



# ===============================================================================
# Global Color & Gamut Target Baseline
# ===============================================================================
gamut-mapping-mode=perceptual
target-trc=pq
target-prim=bt.2020
target-gamut=display-p3
target-peak=150
target-colorspace-hint=yes
target-colorspace-hint-mode=target
target-contrast=auto
hdr-compute-peak=no

# =================================================================================================
# JELLYFIN SHIM FIX: Restricts reset parameters to protect background Shim communication properties
# =================================================================================================
reset-on-next-file=audio-delay,sub-delay,speed,video-aspect-override

# ==============================================================================
# LANGUAGE, SUBTITLE SAFETY & AUTO-CROP ALIGNMENT
# ==============================================================================
alang=eng,en
slang=eng,en
sub-pos=95
sub-use-margins=no
sub-hdr-peak=100
image-subs-hdr-peak=100

# ==============================================================================
# AUTO-CROP INFRASTRUCTURE
# ==============================================================================
script-opts=autocrop-auto=yes,autocrop-speed=4,autocrop-blacklimit=5

# ==============================================================================
# Audio Path for HDMI AVR Playback
# ==============================================================================
ao=wasapi
audio-exclusive=yes
audio-channels=7.1,5.1,stereo
audio-spdif=ac3,eac3,dts,dts-hd,truehd

# ==============================================================================
# BITSTREAM-COMPATIBLE A/V SYNC & SHADER FLOW MANAGEMENT
# ==============================================================================
video-sync=audio
framedrop=vo
hr-seek=yes

# ==============================================================================
# AMD RX 9060 XT Optimized Scaling, Debanding & Fast Blue-Noise Dithering
# ==============================================================================
gpu-shader-cache-dir="~~/shaders/cache"

# ==============================================================================
# Anti-Ringing & Scaling Refinements for Epson 5050UB Pixel Shifting
# ==============================================================================
# 1D separable luma scaler with moderate anti-ringing for 5050UB pixel shifting
scale=spline36
scale-antiring=0.7

# Mitchell (B=1/3, C=1/3) is inherently ring-resistant; no anti-ringing pass needed
cscale=mitchell
cscale-antiring=0

# Downscaling (unchanged; bypassed during upscaling)
dscale=mitchell
correct-downscaling=yes
linear-downscaling=no

deband=yes
deband-iterations=1
deband-threshold=16
deband-range=16
deband-grain=0

dither-depth=10
dither=fruit

# =================================================================================================
# Conditional Dynamic Containers (Evaluated ABOVE resolution shaders for bottom-to-top precedence)
# =================================================================================================

[DoVi-P5]
profile-desc=Strip YCbCr-dependent shaders on Dolby Vision Profile 5 (IPT-PQ)
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) == 5
profile-restore=copy
deband=no
glsl-shaders-clr
audio-spdif=ac3,eac3,dts,dts-hd,truehd

[SDR]
profile-desc=SDR-to-HDR Container Pass: Scales 203-nit SDR white down to ~172-nit PQ to match HDR brightness
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and p["video-params/gamma"] ~= nil and p["video-params/gamma"] ~= "pq" and p["video-params/gamma"] ~= "hlg" and p["video-params/colormatrix"] ~= "dolbyvision" and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) == 0 and p["video-params/hdr-format"] ~= "dolby-vision"
profile-restore=copy
target-peak=203
contrast=-25
brightness=0
audio-spdif=ac3,eac3,dts,dts-hd,truehd

# Optional: Comment out [SDR-Filmgrain] if sharpened SDR + synthetic grain looks too noisy
[SDR-Filmgrain]
profile-desc=Applies film grain to SDR content after resolution shaders finish loading
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and p["video-params/gamma"] ~= nil and p["video-params/gamma"] ~= "pq" and p["video-params/gamma"] ~= "hlg" and p["video-params/colormatrix"] ~= "dolbyvision" and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) == 0 and p["video-params/hdr-format"] ~= "dolby-vision"
profile-restore=copy
glsl-shaders-remove="~~/shaders/filmgrain.glsl"
glsl-shaders-append="~~/shaders/filmgrain.glsl"

[HDR]
profile-desc=Native HDR output policy with boosted contrast recovery and PQ CAS sharpening
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and (p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg") and p["video-params/colormatrix"] ~= "dolbyvision" and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) == 0 and p["video-params/hdr-format"] ~= "dolby-vision" and p["video-params/hdr-format"] ~= "hdr10-plus" and get("video-params/scene-max-r", 0) <= 0 and get("video-params/scene-max-g", 0) <= 0 and get("video-params/scene-max-b", 0) <= 0
profile-restore=copy
deband=no
tone-mapping=spline
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-peak-decay-rate=15
hdr-contrast-recovery=0.30
audio-spdif=ac3,eac3,dts,dts-hd,truehd
glsl-shaders-remove="~~/shaders/CAS.glsl"
glsl-shaders-remove="~~/shaders/CAS_PQ.glsl"
glsl-shaders-append="~~/shaders/CAS_PQ.glsl"
glsl-shaders-remove="~~/shaders/CAS-scaled.glsl"
glsl-shaders-remove="~~/shaders/CAS-scaled_PQ.glsl"
glsl-shaders-append="~~/shaders/CAS-scaled_PQ.glsl"


[DoVi]
profile-desc=Dolby Vision Profile 8 dynamic metadata policy (RPU-driven, P5 & P7 excluded)
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) ~= 5 and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) ~= 7 and (p["video-params/colormatrix"] == "dolbyvision" or (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) > 0 or p["video-params/hdr-format"] == "dolby-vision")
profile-restore=copy
deband=no
tone-mapping=spline
hdr-compute-peak=no
hdr-contrast-recovery=0.30
audio-spdif=ac3,eac3,dts,dts-hd,truehd
glsl-shaders-remove="~~/shaders/CAS.glsl"
glsl-shaders-remove="~~/shaders/CAS_PQ.glsl"
glsl-shaders-append="~~/shaders/CAS_PQ.glsl"
glsl-shaders-remove="~~/shaders/CAS-scaled.glsl"
glsl-shaders-remove="~~/shaders/CAS-scaled_PQ.glsl"
glsl-shaders-append="~~/shaders/CAS-scaled_PQ.glsl"

[DoVi-P7]
profile-desc=Dolby Vision Profile 7 policy (MEL uses RPU; FEL falls back to dynamic compute-peak)
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) == 7
profile-restore=copy
deband=no
tone-mapping=spline
hdr-compute-peak=yes
hdr-peak-percentile=99.995
hdr-peak-decay-rate=15
hdr-contrast-recovery=0.30
audio-spdif=ac3,eac3,dts,dts-hd,truehd
glsl-shaders-remove="~~/shaders/CAS.glsl"
glsl-shaders-remove="~~/shaders/CAS_PQ.glsl"
glsl-shaders-append="~~/shaders/CAS_PQ.glsl"
glsl-shaders-remove="~~/shaders/CAS-scaled.glsl"
glsl-shaders-remove="~~/shaders/CAS-scaled_PQ.glsl"
glsl-shaders-append="~~/shaders/CAS-scaled_PQ.glsl"

[HDRplus]
profile-desc=HDR10+ dynamic metadata policy with boosted contrast recovery and PQ CAS
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and (p["video-params/hdr-format"] == "hdr10-plus" or get("video-params/scene-max-r", 0) > 0 or get("video-params/scene-max-g", 0) > 0 or get("video-params/scene-max-b", 0) > 0) and p["video-params/colormatrix"] ~= "dolbyvision" and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) == 0 and p["video-params/hdr-format"] ~= "dolby-vision"
profile-restore=copy
deband=no
tone-mapping=st2094-40
hdr-contrast-recovery=0.35
hdr-compute-peak=no
audio-spdif=ac3,eac3,dts,dts-hd,truehd
glsl-shaders-remove="~~/shaders/CAS.glsl"
glsl-shaders-remove="~~/shaders/CAS_PQ.glsl"
glsl-shaders-append="~~/shaders/CAS_PQ.glsl"
glsl-shaders-remove="~~/shaders/CAS-scaled.glsl"
glsl-shaders-remove="~~/shaders/CAS-scaled_PQ.glsl"
glsl-shaders-append="~~/shaders/CAS-scaled_PQ.glsl"

# =================================================================================================
# SHADER UPSCALE & RESOLUTION RULES PIPELINES (Evaluated first due to bottom-to-top order)
# =================================================================================================

[High-FPS-Override]
profile-desc=Lightweight upscale + post-scale CAS for sub-4K sources over 31 FPS
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) ~= 5 and p["video-params/w"] < 3840 and p["video-params/h"] < 2160 and (p["container-fps"] or 24) > 31
profile-restore=copy
glsl-shaders-clr
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/ravu-lite-ar-r3.hook"
glsl-shaders-append="~~/shaders/CAS-scaled.glsl"

[4k-native]
profile-desc=Native 4K sources (Excludes DoVi P5 IPT-PQ)
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) ~= 5 and (p["video-params/w"] >= 3840 or p["video-params/h"] >= 2160)
profile-restore=copy
glsl-shaders-clr
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/CAS.glsl"

[sub-4k]
profile-desc=1080p and 720p sources: CfL + FSRCNNX 8-0-4-1 + post-scale CAS
profile-cond=p["video-params/w"] ~= nil and p["video-params/colormatrix"] ~= nil and (tonumber(get("current-tracks/video/dolby-vision-profile")) or 0) ~= 5 and p["video-params/w"] < 3840 and p["video-params/h"] < 2160 and (p["container-fps"] or 24) <= 31
profile-restore=copy
glsl-shaders-clr
glsl-shaders-append="~~/shaders/CfL_Prediction.glsl"
glsl-shaders-append="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"
glsl-shaders-append="~~/shaders/CAS-scaled.glsl"