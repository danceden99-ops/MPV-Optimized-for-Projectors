# ==============================================================================
# MPV CUSTOM HOTKEYS (No-LUT Baseline)
# ==============================================================================

# Cycle Tone-Mapping Curves (Shift + H)
H cycle-values tone-mapping "spline" "bt.2390" "bt.2446a" "clip" ; show-text "Tone Mapping: ${tone-mapping}"

# Cycle Target Peak Brightness in Nits (Shift + N)
N cycle-values target-peak "80" "100" "120" "150" "200" "250" "300" "400" "500" ; show-text "Target Peak: ${target-peak} nits"

# Cycle Gamut Mapping Modes (Shift + G)
G cycle-values gamut-mapping-mode "perceptual" "relative" "saturation" "clip" "reinhard"; show-text "Gamut Mapping: ${gamut-mapping-mode}"

# Reset Live Overrides Back to Baseline (Shift + R)
R set tone-mapping "spline" ; set target-peak "150" ; set gamut-mapping-mode "perceptual" ; show-text "Reset to Baseline: spline | 150 nits | perceptual"